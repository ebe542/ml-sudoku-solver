[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sudoku-solver"
version = "0.1.0"
description = "A self-directed machine learning project for analyzing and solving Sudoku grids."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "joblib",
]

[project.scripts]
sudoku-ml = "sudoku_ml.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:joblib.numpy_pickle",
]
